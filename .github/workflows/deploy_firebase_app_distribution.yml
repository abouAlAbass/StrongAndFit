name: Deploy to Firebase App Distribution

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'Manual release triggered from GitHub Actions'
        type: string
      testers_group:
        description: 'Tester group name in Firebase App Distribution'
        required: false
        default: 'testers'
        type: string
      testers_emails:
        description: 'Direct tester emails (comma-separated)'
        required: false
        default: 'fetni.wassim@gmail.com'
        type: string

jobs:
  distribute_android:
    name: Build & Distribute Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Configure Android Release Signing (Consistent Upgrades)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
            if [ ! -s android/app/upload-keystore.jks ]; then
              echo "❌ Error: Decoded upload-keystore.jks is empty!"
              exit 1
            fi
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "✅ Release keystore configured for in-place Android upgrades."
            keytool -list -v -keystore android/app/upload-keystore.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep -E "Alias name:|SHA1:|SHA256:" || true
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 not set; falling back to ephemeral debug keystore."
          fi

      - name: Build Android Release APK
        run: |
          for i in 1 2 3 4; do
            echo "Attempt $i: Building Android Release APK..."
            if flutter build apk --release --build-number=${{ github.run_number }} --android-skip-build-dependency-validation; then
              exit 0
            fi
            echo "Transient error during build/download, retrying in 5s..."
            sleep 5
          done
          echo "Final attempt 5: Building Android Release APK..."
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --android-skip-build-dependency-validation

      - name: Archive Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strongfit-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: ${{ github.event.inputs.testers_emails || secrets.FIREBASE_TESTERS || vars.FIREBASE_TESTERS || 'fetni.wassim@gmail.com' }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'Automated CI/CD build from main branch' }}

